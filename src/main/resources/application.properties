quarkus.application.name=code-with-quarkus
quarkus.http.port=9596

# Reactive datasource (Vert.x Postgres client) - no blocking JDBC driver
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=quarkus_local
quarkus.datasource.password=postgres
quarkus.datasource.reactive.url=postgresql://localhost:6695/attendance

# Hibernate Reactive ORM
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true