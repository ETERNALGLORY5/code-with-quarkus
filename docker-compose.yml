services:
  postgres:
    image: postgres:16-alpine
    container_name: quarkus-attendance-db
    environment:
      POSTGRES_USER: quarkus_local
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: attendance
    ports:
      - "6695:5432"
    volumes:
      - quarkus-attendance-db-data:/var/lib/postgresql/data

volumes:
  quarkus-attendance-db-data:
